[project]
name = "agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "ollama>=0.6.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "snowflake-connector-python>=4.8.0",
]

[project.scripts]
agentic = "agentic:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
